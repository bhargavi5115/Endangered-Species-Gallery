name: endangered_species_gallery
description: "Endangered Species Gallery - A Real-World Wildlife Conservation and Biodiversity Information Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.4.0
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icons/
    - assets/images/species/
    - assets/images/education/
